<title>Pack Plan</title>
<style>
:root{
  --r:4px;
  --nav:72px;
  color-scheme:dark;
  --bg:#121013;
  --card:#1c191d;
  --card2:#262228;
  --navbg:#121013;
  --ink:#f7f5f2;
  --muted:#a19c97;
  --line:#3a3639;
  --body-ink:#e8e4e0;
  --accent:#cc5f02;
  --accent-ink:#cc5f02;
  --on-accent:#121013;
  --up:#8fbc7a;
  --down:#e39285;
  --gold:#cc5f02;
  --tag-ink:#cc5f02;
  --hole:#121013;
  --brief-bg:#1c191d;
  --brief-line:#3a3639;
  --stat-bg:#262228;
  --ring-track:#2e2a2f;
  --on-tag:#121013;
  --down-bg:#241618;
  --font-display:Teko,Impact,"Arial Narrow",sans-serif;
  --font-body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f5f2;
  --card:#ffffff;
  --card2:#efece8;
  --navbg:#f7f5f2;
  --ink:#121013;
  --muted:#5c5854;
  --line:#e9e5e0;
  --body-ink:#1c191d;
  --accent:#cc5f02;
  --accent-ink:#9a4700;
  --on-accent:#121013;
  --up:#276334;
  --down:#8f3832;
  --gold:#9a4700;
  --tag-ink:#9a4700;
  --hole:#f7f5f2;
  --brief-bg:#ffffff;
  --brief-line:#e9e5e0;
  --stat-bg:#efece8;
  --ring-track:#e9e5e0;
  --on-tag:#f7f5f2;
  --down-bg:#f3ebe9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
body{max-width:520px;margin:0 auto;padding-bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
h1,h2,h3,.big,.wordmark,.month-label,nav.tabs button,.btn,.pagetitle h2,.tag,.paid-btn,.stat b{
  font-family:var(--font-display);
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-synthesis:none;
}
.ico{display:inline-block;vertical-align:middle;flex:none}

/* Focus */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f input:focus-visible,label.f select:focus-visible,label.f textarea:focus-visible,
#extra-pay:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
  border-color:var(--accent);
}

/* Header + brand lockup */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.brand-text{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1}
.wordmark{margin:0;font-size:22px;line-height:1;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.wordmark .wm-r{color:var(--ink)}
.wordmark .wm-w{color:var(--accent)}
.top h1{
  font-size:24px;margin:0;font-weight:700;letter-spacing:.08em;
  white-space:nowrap;color:var(--ink);line-height:1;
}
.byline{
  margin:4px 0 0;font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);line-height:1;
  font-family:var(--font-display);white-space:nowrap;
}
.byline .wm-r{color:var(--ink)}
.byline .wm-w{color:var(--accent)}
.hero-empty h2{
  margin:0 0 6px;font-size:40px;font-weight:700;letter-spacing:.08em;color:var(--ink)
}
.hero-empty .byline{font-size:14px;letter-spacing:.16em;margin:0 0 16px}
.hero-empty .byline + p{margin-top:0}

.top .sp{flex:1}
.iconbtn{
  display:grid;place-items:center;
  width:44px;height:44px;min-width:44px;min-height:44px;
  border-radius:4px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);
}
.iconbtn:hover{color:var(--ink);border-color:var(--ink)}

/* Logo */
.logo-wrap{display:inline-grid;flex:none;place-items:center;width:44px;height:44px}
.logo-wrap .logo-mark{grid-area:1/1;display:block;width:100%;height:100%}
.logo-mark{display:block;flex:none;border-radius:0}
.logo-wrap .logo-light{display:none}
:root[data-theme="light"] .logo-wrap .logo-dark{display:none}
:root[data-theme="light"] .logo-wrap .logo-light{display:block}

main{padding:16px 16px 0}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:16px;
}
.card h2{
  display:flex;align-items:center;gap:8px;
  font-size:18px;margin:0 0 12px;font-weight:600;
  letter-spacing:.08em;line-height:1.15;
}
.card h2 .r{margin-left:auto;font-size:16px;color:var(--muted);font-weight:600;letter-spacing:.04em;font-family:var(--font-display)}
.card h2 .ico{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tag{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:2px;
  background:transparent;border:1px solid var(--accent);color:var(--tag-ink);
  vertical-align:middle;line-height:1.2;
}
.tag.up{border-color:var(--up);color:var(--up)}
.tag.down{border-color:var(--down);color:var(--down)}
.tag.accent{border-color:var(--accent);color:var(--accent-ink)}
.up{color:var(--up)}
.down{color:var(--down)}

.pagetitle{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
.pagetitle h2{margin:0;font-size:28px;font-weight:600;letter-spacing:.08em;line-height:1}
.pagetitle .sp{flex:1}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:0;border-radius:4px;
  padding:10px 16px;min-height:44px;
  font-size:16px;font-weight:600;letter-spacing:.1em;
  background:var(--accent);color:var(--on-accent);
}
.btn:hover{filter:brightness(1.08)}
:root[data-theme="light"] .btn:hover{filter:brightness(.96)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);filter:none}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.danger{
  background:transparent;color:var(--down);
  border:1px solid var(--down);filter:none;
}
.btn.danger:hover{background:var(--down);color:var(--bg);filter:none}
.btn.sm{padding:8px 12px;font-size:14px;min-height:44px;border-radius:4px}
.btn.block{width:100%}

/* Hero month brief */
.brief{background:var(--brief-bg);border:1px solid var(--brief-line);border-left:3px solid var(--accent);border-radius:var(--r)}
.brief h2 .ico{color:var(--accent)}
.brief p{margin:0 0 8px}
.brief .stats{display:flex;gap:8px;margin-top:14px}
.brief .stat,.stat{
  flex:1;background:var(--stat-bg);border-radius:4px;padding:10px 12px;
}
.brief .stat b,.stat b{display:block;font-size:20px;font-weight:600;letter-spacing:.04em;margin-top:2px;line-height:1.1;color:var(--ink);text-transform:none}
.brief .stat span,.stat span{display:block;font-size:11px;color:var(--muted);font-weight:600;font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase}
.big{
  font-size:52px;font-weight:700;letter-spacing:.02em;line-height:1;
  color:var(--accent);text-transform:none;
}
.big.down{color:var(--down)}
.big.up{color:var(--up)}
.subbig{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:500}

/* Rows */
.row{
  display:flex;align-items:center;gap:12px;
  padding:12px 2px;min-height:52px;
  border-top:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-bottom:0;
  width:100%;text-align:left;color:inherit;
}
.row:first-of-type{border-top:0}
.row .mid{flex:1;min-width:0}
.row .mid > b{display:block;font-size:15px;font-weight:600;font-family:var(--font-body);letter-spacing:0;text-transform:none}
.row .mid > span,.row .mid .meta{
  display:block;font-size:12.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--font-body);letter-spacing:0;text-transform:none;font-weight:400;
}
.row .mid .tag{display:inline-block;white-space:nowrap;overflow:visible;font-size:11px;margin-right:4px;vertical-align:middle}
.row .end{text-align:right;flex:none}
.row .end b{display:block;font-size:18px;font-weight:600;font-family:var(--font-display);letter-spacing:.04em;text-transform:none;line-height:1.1}
.row .end span{font-size:11px;font-weight:600;color:var(--muted);font-family:var(--font-display);letter-spacing:.08em;text-transform:uppercase}

.av{
  width:40px;height:40px;border-radius:4px;
  display:grid;place-items:center;flex:none;
  background:var(--card2);color:var(--accent);border:1px solid var(--line);
}
.av.warn{background:transparent;color:var(--down);border-color:var(--down)}
.av.gold{background:transparent;color:var(--accent);border-color:var(--accent)}
.av.up{background:transparent;color:var(--up);border-color:var(--up)}

/* Bars — flat, crisp */
.bar{height:6px;background:var(--ring-track);border-radius:2px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:0;background:var(--accent);width:0;max-width:100%}
.bar>i.warn{background:var(--accent)}
.bar>i.over{background:var(--down);max-width:100%}
.barhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.barhead b{font-family:var(--font-body);font-weight:600;letter-spacing:0;text-transform:none}
.barhead span{color:var(--muted);font-variant-numeric:tabular-nums}

/* Segmented control */
.seg{display:flex;background:var(--card2);border-radius:4px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{
  flex:1;border:0;background:none;border-radius:2px;
  padding:0;min-height:44px;
  font-family:var(--font-display);font-weight:600;font-size:15px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.seg button.on{background:var(--accent);color:var(--on-accent)}

/* Forms */
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:500}
label.f input,label.f select,label.f textarea,
#extra-pay{
  display:block;width:100%;margin-top:4px;
  padding:12px 12px;min-height:44px;
  border-radius:4px;border:1px solid var(--line);
  background:var(--card2);font-size:16px;outline:none;
  font-family:var(--font-body);font-variant-numeric:tabular-nums;
}
label.f textarea{min-height:72px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus,#extra-pay:focus{border-color:var(--accent)}
.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}
.err{color:var(--down);font-size:13px;min-height:1.2em;margin:0 0 8px}
.hint{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14.5px;font-weight:600;color:var(--ink);min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.actions{display:flex;gap:8px;margin:12px 0 0}
.actions .btn{flex:1}

/* Tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
  background:var(--navbg);
  border-top:1px solid var(--line);
  padding:4px 6px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs .in{display:flex;width:100%;max-width:520px}
nav.tabs button{
  flex:1;border:0;background:none;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:12px;font-weight:600;letter-spacing:.1em;
  padding:4px 0;min-height:56px;text-transform:uppercase;
}
nav.tabs button .pill{
  display:grid;place-items:center;
  width:48px;height:28px;border-radius:4px;
}
nav.tabs button.on{color:var(--accent-ink)}
nav.tabs button.on .pill{background:transparent;box-shadow:inset 0 -2px 0 var(--accent)}
nav.tabs button.on .ico{color:var(--accent)}

/* Sheet, toast */
.scrim{position:fixed;inset:0;background:rgba(18,16,19,.72);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{
  visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-width:520px;margin:0 auto;
  background:var(--card);
  border-top-left-radius:6px;border-top-right-radius:6px;
  border:1px solid var(--line);
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .25s;
  max-height:92vh;overflow:auto;
}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:.08em}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none;visibility:visible}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav) + 24px);
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);
  font-family:var(--font-display);font-weight:600;font-size:15px;
  letter-spacing:.08em;text-transform:uppercase;
  padding:10px 16px;border-radius:4px;
  opacity:0;transition:.25s;z-index:50;pointer-events:none;
  white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translateX(-50%)}

.empty{text-align:center;color:var(--muted);padding:22px 12px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:20px;margin:8px 0 4px;font-family:var(--font-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.empty .ico{color:var(--accent);opacity:1}
.note{font-size:12.5px;color:var(--muted);margin:4px 4px 16px;line-height:1.55}
.soft{
  display:flex;gap:9px;align-items:flex-start;
  background:transparent;
  border:1px solid var(--accent);
  border-left-width:3px;
  border-radius:4px;
  padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:10px;
  text-wrap:pretty;
}
.soft.warn{background:transparent;border-color:var(--down);border-left-width:3px}
.soft .ico{color:var(--accent);margin-top:1px;flex:none}
.soft.warn .ico{color:var(--down)}
.soft b{color:var(--ink)}
.footer{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.55;padding:8px 16px 20px}

.row.overdue{
  background:var(--down-bg);
  margin:4px 0;
  padding-left:12px;
  padding-right:4px;
  width:100%;
  border-left:3px solid var(--down);
  border-radius:0 2px 2px 0;
}
.paid-btn{
  border:1px solid var(--line);background:var(--card2);color:var(--muted);
  border-radius:4px;padding:0 10px;
  min-height:44px;min-width:44px;
  font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;flex:none;
}
.paid-btn.on{background:var(--up);color:var(--bg);border-color:var(--up)}
.del{border:0;background:none;color:var(--muted);padding:10px;min-width:44px;min-height:44px;border-radius:4px}

.plan-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.plan-table th{
  text-align:left;color:var(--muted);
  font-family:var(--font-display);font-weight:600;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;
  padding:8px 6px;border-bottom:1px solid var(--line);
}
.plan-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.plan-table tr.done td{color:var(--up)}
.plan-table .num{text-align:right;white-space:nowrap}

.order-list{margin:0;padding:0;list-style:none}
.order-list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:44px}
.order-list li:first-child{border-top:0}
.order-list .n{
  width:28px;height:28px;border-radius:2px;
  display:grid;place-items:center;
  background:var(--accent);font-family:var(--font-display);
  font-size:14px;font-weight:700;letter-spacing:0;color:var(--on-accent);flex:none;
}
.order-list .mid{flex:1;min-width:0}
.order-list .mid b{display:block;font-size:14.5px;font-weight:600;font-family:var(--font-body);letter-spacing:0;text-transform:none}
.order-list .mid span{display:block;font-size:12.5px;color:var(--muted);font-family:var(--font-body);letter-spacing:0;text-transform:none;font-weight:400}

body.shot .top{position:relative}
body.shot nav.tabs{position:relative;left:auto;right:auto;bottom:auto}
body.shot .toast{display:none}
body.shot{padding-bottom:18px}

.live{font-size:13.5px;color:var(--accent-ink);font-weight:600;margin:0 0 10px;font-family:var(--font-body);letter-spacing:0;text-transform:none}

.hero-empty{padding:36px 16px 28px;text-align:center}
.hero-empty .logo-wrap{margin:0 auto 14px;width:88px;height:88px}
.hero-empty .wordmark{font-size:32px;margin:0 0 4px}
.hero-empty h2{margin:0 0 6px;font-size:40px;font-weight:700;letter-spacing:.08em;color:var(--ink)}
.hero-empty p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.55}
.hero-empty .btn{min-width:220px}
.hero-empty .btn + .btn, .hero-empty .btn.ghost{margin-top:0}

.breakdown{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.breakdown .bk{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--muted)}
.breakdown .bk b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;min-height:44px}
.toggle .lbl{font-size:14.5px;font-weight:600}
.toggle .lbl span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:4px;transition:.15s;pointer-events:none}
.switch i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:var(--muted);border-radius:2px;transition:.15s}
.switch input:checked+i{background:var(--accent);border-color:var(--accent)}
.switch input:checked+i:before{transform:translateX(18px);background:var(--on-accent)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.month-label{
  font-size:13px;font-weight:600;color:var(--muted);
  letter-spacing:.16em;text-transform:uppercase;margin:0 2px 12px;
}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

@media (prefers-reduced-motion:reduce){
  .sheet,.scrim,.toast,.switch i,.switch i:before,.btn{transition:none;filter:none}
}
@media (min-width:521px){
  body{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
  nav.tabs{left:auto;right:auto;width:520px;margin:0 auto}
}

/* Narrow-phone wrap fixes. Only apply below 431px so the 520px desktop column is unchanged. */
@media (max-width: 430px){
  .soft.warn > div{
    text-wrap: balance;
  }
  .plan-table{table-layout:fixed;width:100%}
  .plan-table .plan-month{width:3.2rem}
  .plan-table th.num, .plan-table td.num{width:4.65rem}
  .plan-table .debt-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
}

/* ---------- state ---------- */
function emptyState(){
  return {
    version: 1,
    currency: '$',
    income: [],
    bills: [],
    categories: [],
    transactions: [],
    debts: [],
    payoff: {method:'snowball', extra:0},
    goals: []
  };
}

let state = emptyState();
let view = 'overview';
let planExpanded = false;
let toastTimer = 0;

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return emptyState();
    const d = JSON.parse(raw);
    return sanitizeState(d);
  }catch(e){
    return emptyState();
  }
}

function sanitizeState(d){
  const s = emptyState();
  if(!d || typeof d !== 'object') return s;
  const cur = String(d.currency == null ? '$' : d.currency).slice(0, 4);
  s.currency = cur || '$';
  s.income = Array.isArray(d.income) ? d.income.map(sanitizeIncome).filter(Boolean) : [];
  s.bills = Array.isArray(d.bills) ? d.bills.map(sanitizeBill).filter(Boolean) : [];
  s.categories = Array.isArray(d.categories) ? d.categories.map(sanitizeCat).filter(Boolean) : [];
  s.transactions = Array.isArray(d.transactions) ? d.transactions.map(sanitizeTx).filter(Boolean) : [];
  s.debts = Array.isArray(d.debts) ? d.debts.map(sanitizeDebt).filter(Boolean) : [];
  s.goals = Array.isArray(d.goals) ? d.goals.map(sanitizeGoal).filter(Boolean) : [];
  const method = d.payoff && d.payoff.method === 'avalanche' ? 'avalanche' : 'snowball';
  const extra = d.payoff ? toMoney(d.payoff.extra) : 0;
  s.payoff = {method, extra: extra >= 0 ? extra : 0};
  return s;
}

function sanitizeIncome(x){
  if(!x || typeof x !== 'object') return null;
  const name = String(x.name||'').trim().slice(0, 80);
  if(!name) return null;
  const freq = INCOME_FREQ[x.frequency] ? x.frequency : 'monthly';
  return {id: String(x.id||uid()), name, amount: Math.max(0, toMoney(x.amount)), frequency: freq};
}
function sanitizeBill(x){
  if(!x || typeof x !== 'object') return null;
  const name = String(x.name||'').trim().slice(0, 80);
  if(!name) return null;
  const freq = BILL_FREQ[x.frequency] ? x.frequency : 'monthly';
  let dueDay = parseInt(x.dueDay, 10);
  if(!Number.isFinite(dueDay) || dueDay < 1 || dueDay > 31) dueDay = 1;
  const paid = Array.isArray(x.paid) ? x.paid.filter(p => /^\d{4}-\d{2}$/.test(p)).slice(-36) : [];
  return {
    id: String(x.id||uid()),
    name,
    amount: Math.max(0, toMoney(x.amount)),
    frequency: freq,
    dueDay,
    anchor: /^\d{4}-\d{2}-\d{2}$/.test(x.anchor||'') ? x.anchor : '',
    autopay: !!x.autopay,
    category: String(x.category||'Other').trim().slice(0, 40) || 'Other',
    paid
  };
}
function sanitizeCat(x){
  if(!x || typeof x !== 'object') return null;
  const name = String(x.name||'').trim().slice(0, 80);
  if(!name) return null;
  return {id: String(x.id||uid()), name, limit: Math.max(0, toMoney(x.limit))};
}
function sanitizeTx(x){
  if(!x || typeof x !== 'object') return null;
  const amount = toMoney(x.amount);
  if(!(amount > 0)) return null;
  const date = /^\d{4}-\d{2}-\d{2}$/.test(x.date||'') ? x.date : isoDate(new Date());
  return {id: String(x.id||uid()), date, amount, categoryId: String(x.categoryId||''), note: String(x.note||'').trim().slice(0, 160)};
}
function sanitizeDebt(x){
  if(!x || typeof x !== 'object') return null;
  const name = String(x.name||'').trim().slice(0, 80);
  if(!name) return null;
  const apr = Number(x.apr);
  return {
    id: String(x.id||uid()),
    name,
    balance: Math.max(0, toMoney(x.balance)),
    apr: Number.isFinite(apr) ? Math.min(100, Math.max(0, Math.round(apr*1000)/1000)) : 0,
    minimum: Math.max(0, toMoney(x.minimum))
  };
}
function sanitizeGoal(x){
  if(!x || typeof x !== 'object') return null;
  const name = String(x.name||'').trim().slice(0, 80);
  if(!name) return null;
  return {
    id: String(x.id||uid()),
    name,
    target: Math.max(0, toMoney(x.target)),
    saved: Math.max(0, toMoney(x.saved)),
    monthly: Math.max(0, toMoney(x.monthly)),
    emergency: !!x.emergency
  };
}

/* ---------- money & dates ---------- */
function round2(n){
  const x = Number(n);
  if(!Number.isFinite(x)) return 0;
  return Math.round(x * 100) / 100;
}
function toMoney(v){
  if(typeof v === 'number') return Number.isFinite(v) ? round2(v) : 0;
  const t = String(v==null?'':v).trim().replace(/[^0-9.+-]/g,'');
  if(t==='' || t==='.' || t==='-' || t==='+' || t==='+.') return 0;
  const n = Number(t);
  return Number.isFinite(n) ? round2(n) : 0;
}
function parseMoneyInput(v){
  const t = String(v==null?'':v).trim();
  if(t==='') return {ok:false, empty:true, value:NaN};
  const cleaned = t.replace(/[^0-9.+-]/g,'');
  const n = Number(cleaned);
  if(!Number.isFinite(n)) return {ok:false, empty:false, value:NaN};
  if(n < 0) return {ok:false, empty:false, value:n, err:'Enter a number that’s zero or more'};
  if(n > 999999999) return {ok:false, empty:false, value:n, err:'That amount is too large'};
  return {ok:true, empty:false, value:round2(n)};
}
function parseApr(v){
  const t = String(v==null?'':v).trim();
  if(t==='') return {ok:false, empty:true, value:NaN};
  const n = Number(t.replace(/[^0-9.+-]/g,''));
  if(!Number.isFinite(n)) return {ok:false, empty:false, value:NaN};
  if(n < 0 || n > 100) return {ok:false, empty:false, value:n, err:'APR should be between 0 and 100'};
  return {ok:true, empty:false, value: Math.round(n*1000)/1000};
}

function currency(){ return state.currency || '$'; }
function fmt(n, opts){
  const x = round2(n);
  const neg = x < 0;
  const abs = Math.abs(x);
  const digits = (opts && opts.plain) ? String(abs) : abs.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  const s = currency() + digits;
  return neg ? '−' + s : s;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function today(){ return startOfDay(new Date()); }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function parseISO(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  if(d.getFullYear()!=+m[1] || d.getMonth()!=+m[2]-1 || d.getDate()!=+m[3]) return null;
  return d;
}
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function dateClamped(y,m,day){ return new Date(y, m, Math.min(Math.max(1,day), daysInMonth(y,m))); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function thisMonthKey(){ return monthKey(today()); }
function fmtDate(d){
  if(!d) return '';
  return MONTHS_SHORT[d.getMonth()]+' '+d.getDate();
}
function fmtDateLong(d){
  if(!d) return '';
  return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function fmtMonthYear(y, mi){ return MONTHS[mi]+' '+y; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return startOfDay(x); }

/* ---------- math ---------- */
function monthlyEquivalent(amount, freq){
  const a = Number(amount)||0;
  switch(freq){
    case 'weekly': return a * 52 / 12;
    case 'biweekly': return a * 26 / 12;
    case 'semimonthly': return a * 2;
    case 'monthly': return a;
    case 'irregular': return a;
    case 'quarterly': return a * 4 / 12;
    case 'semiannual': return a * 2 / 12;
    case 'yearly': return a / 12;
    case 'once': return 0;
    default: return a;
  }
}

function monthlyIncome(){
  return round2(state.income.reduce(function(s,i){ return s + monthlyEquivalent(i.amount, i.frequency); }, 0));
}

function billMonthly(b){
  if(b.frequency === 'once'){
    const due = nextDue(b);
    if(due && monthKey(due) === thisMonthKey()) return round2(b.amount);
    return 0;
  }
  return round2(monthlyEquivalent(b.amount, b.frequency));
}

function billsMonthly(){
  return round2(state.bills.reduce(function(s,b){ return s + billMonthly(b); }, 0));
}
function categoriesMonthly(){
  return round2(state.categories.reduce(function(s,c){ return s + (Number(c.limit)||0); }, 0));
}
function debtsMinMonthly(){
  return round2(state.debts.reduce(function(s,d){ return s + (Number(d.minimum)||0); }, 0));
}
function goalsMonthly(){
  return round2(state.goals.reduce(function(s,g){ return s + (Number(g.monthly)||0); }, 0));
}
function plannedSpending(){
  return round2(billsMonthly() + categoriesMonthly() + debtsMinMonthly() + goalsMonthly());
}
function leftToAssign(){
  return round2(monthlyIncome() - plannedSpending());
}

function nextDue(bill, from){
  const t = startOfDay(from || today());
  const y = t.getFullYear(), m = t.getMonth();
  const paidKey = monthKey(t);
  const paid = (bill.paid||[]).indexOf(paidKey) !== -1;
  const freq = bill.frequency || 'monthly';

  if(freq === 'once'){
    return bill.anchor ? (parseISO(bill.anchor) || t) : t;
  }

  if(freq === 'weekly' || freq === 'biweekly'){
    const step = freq === 'weekly' ? 7 : 14;
    let due = bill.anchor && parseISO(bill.anchor) ? parseISO(bill.anchor) : t;
    let guard = 0;
    if(due < t){
      const days = Math.round((t - due)/86400000);
      const k = Math.floor(days/step);
      due = addDays(due, k*step);
      if(due < t){
        if(!paid) return due;
        due = addDays(due, step);
      }
    }
    if(paid){
      while(due.getFullYear()===y && due.getMonth()===m && guard++ < 12){
        due = addDays(due, step);
      }
    }
    return due;
  }

  if(freq === 'quarterly' || freq === 'semiannual' || freq === 'yearly'){
    const stepM = freq === 'quarterly' ? 3 : (freq === 'semiannual' ? 6 : 12);
    const anchor = bill.anchor && parseISO(bill.anchor) ? parseISO(bill.anchor) : dateClamped(y, m, Number(bill.dueDay)||1);
    const ad = anchor.getDate();
    // Latest occurrence on or before this month's end, for overdue detection
    let due = dateClamped(anchor.getFullYear(), anchor.getMonth(), ad);
    let guard = 0;
    while(due < t && guard++ < 240){
      const next = dateClamped(due.getFullYear(), due.getMonth()+stepM, ad);
      if(next >= t){
        if(!paid && due < t && (due.getFullYear() < y || (due.getFullYear()===y && due.getMonth()===m))){
          // due already passed this period — if it's in a past period that's unpaid,
          // show that past due only if it's the current cycle (same month for yearly is rare).
          // For quarterly/yearly, a past occurrence that's unpaid is overdue until paid this month.
          // If the last occurrence is before this month, it's overdue.
          return due;
        }
        due = next;
        break;
      }
      due = next;
    }
    if(paid && due.getFullYear()===y && due.getMonth()===m){
      due = dateClamped(due.getFullYear(), due.getMonth()+stepM, ad);
    }
    return due;
  }

  // monthly
  const day = Math.min(31, Math.max(1, Number(bill.dueDay)||1));
  const thisDue = dateClamped(y, m, day);
  if(!paid && thisDue < t) return thisDue;
  if(!paid) return thisDue;
  return dateClamped(y, m+1, day);
}

function isOverdue(bill){
  if((bill.paid||[]).indexOf(thisMonthKey()) !== -1) return false;
  const due = nextDue(bill);
  return due && due < today();
}

function spentInMonth(categoryId, mk){
  mk = mk || thisMonthKey();
  return round2(state.transactions.reduce(function(s,t){
    if(t.categoryId !== categoryId) return s;
    if(!t.date || t.date.slice(0,7) !== mk) return s;
    return s + (Number(t.amount)||0);
  }, 0));
}

function goalProjection(goal){
  const remaining = round2((Number(goal.target)||0) - (Number(goal.saved)||0));
  if(remaining <= 0) return {done:true, months:0, year:null, monthIdx:null};
  const c = Number(goal.monthly)||0;
  if(c <= 0) return {done:false, months:null, year:null, monthIdx:null};
  const months = Math.ceil(remaining / c);
  const d = today();
  const end = new Date(d.getFullYear(), d.getMonth() + months - 1, 1);
  return {done:false, months:months, year:end.getFullYear(), monthIdx:end.getMonth()};
}

/* Amortization payoff plan.
   Total monthly payment is held constant: sum of original minimums + extra.
   Each month: interest accrues, minimums are paid, leftover goes to the target
   (snowball = smallest balance first, avalanche = highest APR first).
   When a debt is paid off, its minimum rolls into the leftover automatically
   because the monthly budget does not shrink. */
function payoffPlan(debts, method, extra){
  const items = (debts||[])
    .filter(function(d){ return Number(d.balance) > 0; })
    .map(function(d){
      return {
        id: d.id,
        name: d.name,
        balance: round2(d.balance),
        apr: Number(d.apr)||0,
        min: Math.max(0, round2(d.minimum))
      };
    });
  if(!items.length){
    return {months:[], monthsCount:0, totalInterest:0, debtFree:null, order:[], stuck:false, monthlyBudget:0};
  }
  const monthlyBudget = round2(items.reduce(function(s,d){ return s+d.min; }, 0) + Math.max(0, Number(extra)||0));
  const order = [];
  const months = [];
  let totalInterest = 0;
  const MAX = 600;
  const now = today();
  const startY = now.getFullYear();
  const startMo = now.getMonth();

  function sortActive(){
    return items.filter(function(d){ return d.balance > 0.005; }).sort(function(a,b){
      if(method === 'avalanche'){
        if(b.apr !== a.apr) return b.apr - a.apr;
        if(a.balance !== b.balance) return a.balance - b.balance;
      }else{
        if(a.balance !== b.balance) return a.balance - b.balance;
        if(b.apr !== a.apr) return b.apr - a.apr;
      }
      return String(a.name).localeCompare(String(b.name));
    });
  }

  for(let m=0; m<MAX; m++){
    const active = sortActive();
    if(!active.length) break;
    const year = startY + Math.floor((startMo + m)/12);
    const monthIdx = (startMo + m) % 12;

    for(let i=0;i<active.length;i++){
      const d = active[i];
      const interest = round2(d.balance * (d.apr/100) / 12);
      d.balance = round2(d.balance + interest);
      d._int = interest;
      d._paid = 0;
      totalInterest = round2(totalInterest + interest);
    }

    let cash = monthlyBudget;
    for(let i=0;i<items.length;i++){
      const d = items[i];
      if(d.balance <= 0.005 || cash <= 0.005) continue;
      const pay = Math.min(d.min, d.balance, cash);
      d.balance = round2(d.balance - pay);
      d._paid = round2((d._paid||0) + pay);
      cash = round2(cash - pay);
      if(d.balance <= 0.005) d.balance = 0;
    }
    for(let i=0;i<active.length;i++){
      const d = active[i];
      if(d.balance <= 0.005 || cash <= 0.005) continue;
      const pay = Math.min(cash, d.balance);
      d.balance = round2(d.balance - pay);
      d._paid = round2((d._paid||0) + pay);
      cash = round2(cash - pay);
      if(d.balance <= 0.005) d.balance = 0;
    }

    const payments = active.map(function(d){
      return {
        id:d.id, name:d.name,
        payment:d._paid||0,
        interest:d._int||0,
        principal: round2((d._paid||0) - (d._int||0)),
        balance:d.balance,
        paidOff: d.balance <= 0.005
      };
    });
    for(let i=0;i<payments.length;i++){
      const p = payments[i];
      if(p.paidOff && !order.some(function(o){ return o.id===p.id; })){
        order.push({id:p.id, name:p.name, month:m+1, year:year, monthIdx:monthIdx});
      }
    }
    months.push({
      n:m+1, year:year, monthIdx:monthIdx, payments:payments,
      totalPaid: round2(payments.reduce(function(s,p){ return s+p.payment; },0)),
      interest: round2(payments.reduce(function(s,p){ return s+p.interest; },0))
    });
  }

  const stuck = items.some(function(d){ return d.balance > 0.005; });
  const last = months[months.length-1];
  return {
    months: months,
    monthsCount: months.length,
    totalInterest: totalInterest,
    debtFree: (stuck || !last) ? null : {year:last.year, monthIdx:last.monthIdx},
    order: order,
    stuck: stuck,
    monthlyBudget: monthlyBudget
  };
}

      const spent = spentInMonth(c.id);
      const pct = c.limit>0 ? (spent/c.limit)*100 : (spent>0?100:0);
      html += '<div style="margin:10px 0"><div class="barhead"><b>'+esc(c.name)+'</b><span>'+esc(fmt(spent))+' of '+esc(fmt(c.limit))+'</span></div>'+progressBar(pct)+'</div>';
    });
    html += '</div>';
  }

  html += footer();
  return html;
}
function bk(label, amt){
  return '<div class="bk"><span>'+esc(label)+'</span><b>'+esc(fmt(amt))+'</b></div>';
}
function goalProjText(proj, goal){
  if(proj.done) return 'Reached — nice work.';
  if(proj.months==null) return 'Add a monthly contribution to see a finish date.';
  return 'On track for '+MONTHS[proj.monthIdx]+' '+proj.year+' · '+proj.months+' month'+(proj.months===1?'':'s');
}

function byDue(a,b){
  const da = nextDue(a), db = nextDue(b);
  return (da?da.getTime():0) - (db?db.getTime():0) || a.name.localeCompare(b.name);
}
function upcomingBills(days){
  const t = today();
  const end = addDays(t, days);
  return state.bills.filter(function(b){
    if(isOverdue(b)) return false;
    const d = nextDue(b);
    return d && d>=t && d<=end;
  }).sort(byDue);
}

function billRow(b, compact){
  const due = nextDue(b);
  const overdue = isOverdue(b);
  const paid = (b.paid||[]).indexOf(thisMonthKey())!==-1;
  const cls = 'row'+(overdue?' overdue':'');
  const dueText = paid ? 'Paid · next '+fmtDate(due) : (overdue?'Overdue · '+fmtDate(due):'Due '+fmtDate(due));
  const tags = (b.autopay?' <span class="tag accent">Autopay</span>':'');
  return '<div class="'+cls+'" data-testid="bill-'+esc(b.id)+'">'
    +'<div class="av'+(overdue?' warn':'')+'">'+ico(overdue?'warn':'calendar',18)+'</div>'
    +'<button type="button" class="mid" data-act="edit-bill" data-id="'+esc(b.id)+'" style="background:none;border:0;padding:0;text-align:left"><b>'+esc(b.name)+tags+'</b><span class="meta">'+esc(b.category||'')+' · '+esc(dueText)+'</span></button>'
    +'<div class="end"><b>'+esc(fmt(b.amount))+'</b>'
    +'<button type="button" class="paid-btn'+(paid?' on':'')+'" data-act="toggle-paid" data-id="'+esc(b.id)+'" aria-pressed="'+(paid?'true':'false')+'" aria-label="'+(paid?'Mark '+b.name+' unpaid':'Mark '+b.name+' paid')+'">'+(paid?'Paid':'Mark paid')+'</button>'
    +'</div></div>';
}

function renderSpend(){

function renderPayoffCard(){
  const method = (state.payoff&&state.payoff.method)==='avalanche'?'avalanche':'snowball';
  const extra = state.payoff ? (Number(state.payoff.extra)||0) : 0;
  let html = '<div class="card" data-testid="payoff-card">';
  html += '<h2>'+ico('target',20)+' Payoff planner</h2>';
  html += '<p class="small muted" style="margin:0 0 10px">Snowball: smallest balance first. Avalanche: highest APR first. Monthly payment stays at minimums plus extra, so paid-off debts roll into the next.</p>';
  html += '<div class="seg" role="tablist" aria-label="Payoff method">';
  html += '<button type="button" class="'+(method==='snowball'?'on':'')+'" data-act="payoff-method" data-method="snowball" data-testid="method-snowball">Snowball</button>';
  html += '<button type="button" class="'+(method==='avalanche'?'on':'')+'" data-act="payoff-method" data-method="avalanche" data-testid="method-avalanche">Avalanche</button>';
  html += '</div>';
  html += '<label class="f" style="margin-top:12px">Extra monthly payment'
    +'<input type="text" inputmode="decimal" id="extra-pay" data-testid="extra-pay" value="'+esc(extra?String(extra):'')+'" placeholder="0.00" aria-label="Extra monthly payment" autocomplete="off">'
    +'</label>';

  if(!state.debts.length){
    html += '<p class="muted small">Add a debt to see a plan.</p></div>';
    return html;
  }
  const plan = payoffPlan(state.debts, method, extra);
  html += '<div class="stats" style="display:flex;gap:8px;margin:4px 0 12px">';
  html += '<div class="stat" style="flex:1;background:var(--card2);border-radius:4px;padding:8px 10px"><span class="muted small">Debt-free</span><b data-testid="debt-free">'+(plan.debtFree?esc(fmtMonthYear(plan.debtFree.year, plan.debtFree.monthIdx)):(plan.stuck?'Not reached':'—'))+'</b></div>';
  html += '<div class="stat" style="flex:1;background:var(--card2);border-radius:4px;padding:8px 10px"><span class="muted small">Total interest</span><b data-testid="total-interest">'+esc(fmt(plan.totalInterest))+'</b></div>';
  html += '</div>';
  html += '<p class="small muted" data-testid="plan-months">'+esc(plan.stuck
    ? 'These payments may not cover the interest. Try a larger extra payment.'
    : (plan.monthsCount+' month'+(plan.monthsCount===1?'':'s')+' · '+fmt(plan.monthlyBudget)+' each month'))+'</p>';

  if(plan.order.length){
    html += '<h2 style="margin-top:12px">Payoff order</h2><ol class="order-list" data-testid="payoff-order">';
    plan.order.forEach(function(o,i){
      html += '<li><span class="n">'+(i+1)+'</span><div class="mid"><b>'+esc(o.name)+'</b><span class="muted small">'+esc(fmtMonthYear(o.year,o.monthIdx))+' · month '+o.month+'</span></div></li>';
    });
    html += '</ol>';
  }

  if(plan.months.length){
    const show = planExpanded ? plan.months : plan.months.slice(0, 6);
    html += '<h2 style="margin-top:12px">Month by month</h2>';
    html += '<div style="overflow-x:auto"><table class="plan-table" data-testid="plan-table"><thead><tr><th>Month</th><th>Debt</th><th class="num">Payment</th><th class="num">Interest</th><th class="num">Balance</th></tr></thead><tbody>';
    show.forEach(function(mo){
      mo.payments.forEach(function(p, i){
        html += '<tr class="'+(p.paidOff?'done':'')+'">'
          +(i===0?'<td class="plan-month" rowspan="'+mo.payments.length+'">'+esc(MONTHS_SHORT[mo.monthIdx]+' '+mo.year)+'</td>':'')
          +'<td class="debt-name" title="'+esc(p.name)+'">'+esc(p.name)+(p.paidOff?' <span class="tag up">Paid off</span>':'')+'</td>'
          +'<td class="num">'+esc(fmt(p.payment))+'</td>'
          +'<td class="num">'+esc(fmt(p.interest))+'</td>'
          +'<td class="num">'+esc(fmt(p.balance))+'</td></tr>';
      });
    });
    html += '</tbody></table></div>';
    if(plan.months.length > 6){
      html += '<button type="button" class="btn sm ghost block" style="margin-top:10px" data-act="toggle-plan" data-testid="toggle-plan">'
        +(planExpanded?'Show fewer months':'Show all '+plan.months.length+' months')+'</button>';
    }
  }
  html += '</div>';
  return html;
}

/* ---------- sheets & forms ---------- */
function openSheet(html){
  const body = document.getElementById('sheetBody');
  body.innerHTML = html;
  document.body.classList.add('sheet-open');
  const first = body.querySelector('input, select, textarea, button.btn:not(.ghost):not(.danger)');
  if(first) setTimeout(function(){ try{ first.focus(); }catch(e){} }, 50);
}
function closeSheet(){
  document.body.classList.remove('sheet-open');
  document.getElementById('sheetBody').innerHTML = '';
}

function field(label, inner, forId){
  return '<label class="f"'+(forId?' for="'+forId+'"':'')+'>'+esc(label)+inner+'</label>';
}
function textInput(id, val, opts){
  opts = opts || {};
  return '<input type="'+(opts.type||'text')+'" id="'+id+'" name="'+id+'" value="'+esc(val==null?'':val)+'"'
    +(opts.inputmode?' inputmode="'+opts.inputmode+'"':'')
    +(opts.placeholder?' placeholder="'+esc(opts.placeholder)+'"':'')
    +(opts.autocomplete!==undefined?' autocomplete="'+opts.autocomplete+'"':' autocomplete="off"')
    +(opts.maxlength?' maxlength="'+opts.maxlength+'"':'')
    +(opts.aria?' aria-label="'+esc(opts.aria)+'"':'')
    +'>';
}
function selectInput(id, val, options){
  let h = '<select id="'+id+'" name="'+id+'">';
  options.forEach(function(o){
    const v = typeof o === 'string' ? o : o.value;
    const l = typeof o === 'string' ? o : o.label;
    h += '<option value="'+esc(v)+'"'+(v===val?' selected':'')+'>'+esc(l)+'</option>';
  });
  return h+'</select>';
}

function formActions(hasDelete){
  return '<p class="err" id="form-err" role="alert"></p>'
    +'<div class="actions"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button>'
    +'<button type="button" class="btn" data-act="save-form" data-testid="save-form">Save</button></div>'
    +(hasDelete?'<button type="button" class="btn danger block" style="margin-top:10px" data-act="delete-form" data-testid="delete-form">'+ico('trash',16)+' Delete</button>':'');
}

function showErr(msg){
  const el = document.getElementById('form-err');
  if(el) el.textContent = msg || '';
}

let formKind = null;
let formId = null;

function sheetIncome(id){
  const item = id && state.income.find(function(x){ return x.id===id; });
  formKind = 'income'; formId = item ? item.id : null;
  const freqOpts = Object.keys(INCOME_FREQ).map(function(k){ return {value:k, label:INCOME_FREQ[k]}; });
  openSheet('<h3 id="sheetTitle">'+(item?'Edit income':'Add income')+'</h3>'
    +field('Name', textInput('f-name', item?item.name:'', {placeholder:'e.g. Example paycheck', maxlength:80, aria:'Income name'}), 'f-name')
    +'<div class="frow">'
    +field('Amount', textInput('f-amount', item?item.amount:'', {inputmode:'decimal', placeholder:'0.00', aria:'Amount'}), 'f-amount')
    +field('Frequency', selectInput('f-freq', item?item.frequency:'biweekly', freqOpts), 'f-freq')
    +'</div>'
    +'<p class="live" id="f-preview"></p>'
    +formActions(!!item));
  updateIncomePreview();
}
function updateIncomePreview(){
  const el = document.getElementById('f-preview');
  if(!el) return;
  const a = parseMoneyInput(document.getElementById('f-amount').value);
  const freq = document.getElementById('f-freq').value;
  if(!a.ok){ el.textContent = ''; return; }
  el.textContent = 'Monthly equivalent: '+fmt(round2(monthlyEquivalent(a.value, freq)));
}

function sheetBill(id){
  const item = id && state.bills.find(function(x){ return x.id===id; });
  formKind = 'bill'; formId = item ? item.id : null;
  const freqOpts = Object.keys(BILL_FREQ).map(function(k){ return {value:k, label:BILL_FREQ[k]}; });
  const catOpts = BILL_CATS.slice();
  if(item && item.category && catOpts.indexOf(item.category)===-1) catOpts.push(item.category);
  const freq = item ? item.frequency : 'monthly';
  openSheet('<h3 id="sheetTitle">'+(item?'Edit bill':'Add a bill')+'</h3>'
    +field('Name', textInput('f-name', item?item.name:'', {placeholder:'e.g. Example rent', maxlength:80, aria:'Bill name'}), 'f-name')
    +'<div class="frow">'
    +field('Amount', textInput('f-amount', item?item.amount:'', {inputmode:'decimal', placeholder:'0.00', aria:'Amount'}), 'f-amount')
    +field('Frequency', selectInput('f-freq', freq, freqOpts), 'f-freq')
    +'</div>'
    +'<div id="f-due-wrap">'+dueFields(item, freq)+'</div>'
    +field('Category', selectInput('f-cat', item?item.category:'Housing', catOpts), 'f-cat')
    +'<div class="toggle"><div class="lbl">Autopay<span>A reminder only — this app does not pay bills.</span></div>'
    +'<label class="switch"><input type="checkbox" id="f-autopay" '+(item&&item.autopay?'checked':'')+'><i></i></label></div>'
    +formActions(!!item));
}
function dueFields(item, freq){
  const needsDate = freq==='weekly'||freq==='biweekly'||freq==='quarterly'||freq==='semiannual'||freq==='yearly'||freq==='once';
  if(needsDate){
    const val = (item && item.anchor) || isoDate(today());
    return field('Next due date', textInput('f-anchor', val, {type:'date', aria:'Due date'}), 'f-anchor');
  }
  return field('Due day of month', textInput('f-dueday', item?item.dueDay:1, {inputmode:'numeric', placeholder:'1–31', aria:'Due day of month'}), 'f-dueday')
    +'<span class="hint">For months without that day, the last day is used (for example, the 31st becomes Feb 28).</span>';
}

function sheetCat(id){
  const item = id && state.categories.find(function(x){ return x.id===id; });
  formKind = 'cat'; formId = item ? item.id : null;
  openSheet('<h3 id="sheetTitle">'+(item?'Edit category':'Add a category')+'</h3>'
    +field('Name', textInput('f-name', item?item.name:'', {placeholder:'e.g. Example groceries', maxlength:80, aria:'Category name'}), 'f-name')
    +field('Monthly limit', textInput('f-limit', item?item.limit:'', {inputmode:'decimal', placeholder:'0.00', aria:'Monthly limit'}), 'f-limit')
    +formActions(!!item));
}

function sheetTx(id){
  const item = id && state.transactions.find(function(x){ return x.id===id; });
  formKind = 'tx'; formId = item ? item.id : null;
  if(!state.categories.length){
    openSheet('<h3 id="sheetTitle">Add a category first</h3><p class="muted">Log spending under a budget category. Add one, then come back to this.</p>'
      +'<div class="actions"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button>'
      +'<button type="button" class="btn" data-act="edit-cat">Add a category</button></div>');
    return;
  }
  const opts = state.categories.map(function(c){ return {value:c.id, label:c.name}; });
  openSheet('<h3 id="sheetTitle">'+(item?'Edit transaction':'Log a transaction')+'</h3>'
    +field('Amount', textInput('f-amount', item?item.amount:'', {inputmode:'decimal', placeholder:'0.00', aria:'Amount'}), 'f-amount')
    +field('Category', selectInput('f-cat', item?item.categoryId:state.categories[0].id, opts), 'f-cat')
    +field('Date', textInput('f-date', item?item.date:isoDate(today()), {type:'date', aria:'Date'}), 'f-date')
    +field('Note (optional)', textInput('f-note', item?item.note:'', {placeholder:'What was it?', maxlength:160, aria:'Note'}), 'f-note')
    +formActions(!!item));
}

function sheetDebt(id){
  const item = id && state.debts.find(function(x){ return x.id===id; });
  formKind = 'debt'; formId = item ? item.id : null;
  openSheet('<h3 id="sheetTitle">'+(item?'Edit debt':'Add a debt')+'</h3>'
    +field('Name', textInput('f-name', item?item.name:'', {placeholder:'e.g. Example card', maxlength:80, aria:'Debt name'}), 'f-name')
    +field('Balance', textInput('f-balance', item?item.balance:'', {inputmode:'decimal', placeholder:'0.00', aria:'Balance'}), 'f-balance')
    +'<div class="frow">'
    +field('APR %', textInput('f-apr', item?item.apr:'', {inputmode:'decimal', placeholder:'0.00', aria:'APR percent'}), 'f-apr')
    +field('Minimum payment', textInput('f-min', item?item.minimum:'', {inputmode:'decimal', placeholder:'0.00', aria:'Minimum payment'}), 'f-min')
    +'</div>'
    +formActions(!!item));
}

function sheetGoal(id){
  const item = id && state.goals.find(function(x){ return x.id===id; });
  formKind = 'goal'; formId = item ? item.id : null;
  openSheet('<h3 id="sheetTitle">'+(item?'Edit goal':'Add a goal')+'</h3>'
    +field('Name', textInput('f-name', item?item.name:'', {placeholder:'e.g. Emergency fund', maxlength:80, aria:'Goal name'}), 'f-name')
    +'<div class="frow">'
    +field('Target', textInput('f-target', item?item.target:'', {inputmode:'decimal', placeholder:'0.00', aria:'Target amount'}), 'f-target')
    +field('Already saved', textInput('f-saved', item?item.saved:'', {inputmode:'decimal', placeholder:'0.00', aria:'Already saved'}), 'f-saved')
    +'</div>'
    +field('Monthly contribution', textInput('f-monthly', item?item.monthly:'', {inputmode:'decimal', placeholder:'0.00', aria:'Monthly contribution'}), 'f-monthly')
    +'<div class="toggle"><div class="lbl">Emergency fund<span>Shown on the Overview tab. Only one goal can be the emergency fund.</span></div>'
    +'<label class="switch"><input type="checkbox" id="f-emergency" '+(item&&item.emergency?'checked':'')+'><i></i></label></div>'
    +formActions(!!item));
}

function confirmSheet(title, body, confirmLabel, act, danger){
  formKind = null; formId = null;
  openSheet('<h3 id="sheetTitle">'+esc(title)+'</h3><p>'+body+'</p>'
    +'<div class="actions"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button>'
    +'<button type="button" class="btn'+(danger?' danger':'')+'" data-act="'+esc(act)+'" data-testid="confirm-ok">'+esc(confirmLabel)+'</button></div>');
}

function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function requireName(){
  const name = String(val('f-name')||'').trim();
  if(!name){ showErr('Please enter a name.'); const el=document.getElementById('f-name'); if(el)el.focus(); return null; }
  return name.slice(0,80);
}
function requireMoney(id, label, allowZero){
  const r = parseMoneyInput(val(id));
  if(r.empty){ showErr('Please enter '+label+'.'); const el=document.getElementById(id); if(el)el.focus(); return null; }
  if(!r.ok){ showErr(r.err||('Enter a valid '+label+'.')); const el=document.getElementById(id); if(el)el.focus(); return null; }
  if(!allowZero && r.value===0){ showErr(label.charAt(0).toUpperCase()+label.slice(1)+' should be more than zero.'); const el=document.getElementById(id); if(el)el.focus(); return null; }
  return r.value;
}

function saveForm(){
  showErr('');
  if(formKind==='income'){
    const name = requireName(); if(!name) return;
    const amount = requireMoney('f-amount','an amount', true); if(amount==null) return;
    const frequency = INCOME_FREQ[val('f-freq')] ? val('f-freq') : 'monthly';
    if(formId){
      const it = state.income.find(function(x){ return x.id===formId; });
      if(it){ it.name=name; it.amount=amount; it.frequency=frequency; }
    }else{
      state.income.push({id:uid(), name:name, amount:amount, frequency:frequency});
    }
  }else if(formKind==='bill'){
    const name = requireName(); if(!name) return;
    const amount = requireMoney('f-amount','an amount', true); if(amount==null) return;
    const frequency = BILL_FREQ[val('f-freq')] ? val('f-freq') : 'monthly';
    let dueDay = 1, anchor = '';
    const needsDate = frequency==='weekly'||frequency==='biweekly'||frequency==='quarterly'||frequency==='semiannual'||frequency==='yearly'||frequency==='once';
    if(needsDate){
      const d = parseISO(val('f-anchor'));
      if(!d){ showErr('Please enter a valid due date.'); return; }
      anchor = val('f-anchor');
      dueDay = d.getDate();
    }else{
      const raw = parseInt(val('f-dueday'),10);
      if(!Number.isFinite(raw) || raw<1 || raw>31){ showErr('Due day should be a number from 1 to 31.'); document.getElementById('f-dueday').focus(); return; }
      dueDay = raw;
    }
    const category = String(val('f-cat')||'Other').slice(0,40);
    const autopay = !!(document.getElementById('f-autopay')&&document.getElementById('f-autopay').checked);
    if(formId){
      const it = state.bills.find(function(x){ return x.id===formId; });
      if(it){ it.name=name; it.amount=amount; it.frequency=frequency; it.dueDay=dueDay; it.anchor=anchor; it.category=category; it.autopay=autopay; }
    }else{
      state.bills.push({id:uid(), name:name, amount:amount, frequency:frequency, dueDay:dueDay, anchor:anchor, category:category, autopay:autopay, paid:[]});
    }
  }else if(formKind==='cat'){
    const name = requireName(); if(!name) return;
    const limit = requireMoney('f-limit','a monthly limit', true); if(limit==null) return;
    if(formId){
      const it = state.categories.find(function(x){ return x.id===formId; });
      if(it){ it.name=name; it.limit=limit; }
    }else{
      state.categories.push({id:uid(), name:name, limit:limit});
    }
  }else if(formKind==='tx'){
    const amount = requireMoney('f-amount','an amount', false); if(amount==null) return;
    const categoryId = val('f-cat');
    if(!state.categories.some(function(c){ return c.id===categoryId; })){ showErr('Please choose a category.'); return; }
    const date = parseISO(val('f-date'));
    if(!date){ showErr('Please enter a valid date.'); return; }
    const note = String(val('f-note')||'').trim().slice(0,160);
    if(formId){
      const it = state.transactions.find(function(x){ return x.id===formId; });
      if(it){ it.amount=amount; it.categoryId=categoryId; it.date=val('f-date'); it.note=note; }
    }else{
      state.transactions.push({id:uid(), amount:amount, categoryId:categoryId, date:val('f-date'), note:note});
    }
  }else if(formKind==='debt'){
    const name = requireName(); if(!name) return;
    const balance = requireMoney('f-balance','a balance', true); if(balance==null) return;
    const aprR = parseApr(val('f-apr'));
    if(aprR.empty){ showErr('Please enter an APR (use 0 if there is none).'); document.getElementById('f-apr').focus(); return; }
    if(!aprR.ok){ showErr(aprR.err||'Enter a valid APR.'); document.getElementById('f-apr').focus(); return; }
    const minimum = requireMoney('f-min','a minimum payment', true); if(minimum==null) return;
    if(formId){
      const it = state.debts.find(function(x){ return x.id===formId; });
      if(it){ it.name=name; it.balance=balance; it.apr=aprR.value; it.minimum=minimum; }
    }else{
      state.debts.push({id:uid(), name:name, balance:balance, apr:aprR.value, minimum:minimum});
    }
  }else if(formKind==='goal'){
    const name = requireName(); if(!name) return;
    const target = requireMoney('f-target','a target', false); if(target==null) return;
    const saved = requireMoney('f-saved','an already-saved amount', true); if(saved==null) return;
    const monthly = requireMoney('f-monthly','a monthly contribution', true); if(monthly==null) return;
    const emergency = !!(document.getElementById('f-emergency')&&document.getElementById('f-emergency').checked);
    if(emergency){
      state.goals.forEach(function(g){ g.emergency = false; });
    }
    if(formId){
      const it = state.goals.find(function(x){ return x.id===formId; });
      if(it){ it.name=name; it.target=target; it.saved=saved; it.monthly=monthly; it.emergency=emergency; }
    }else{
      state.goals.push({id:uid(), name:name, target:target, saved:saved, monthly:monthly, emergency:emergency});
    }
  }else{
    return;
  }
  saveState();
  closeSheet();
  render();
  toast('Saved');
}

function deleteForm(){
  if(!formKind || !formId) return;
  const id = formId;
  if(formKind==='income') state.income = state.income.filter(function(x){ return x.id!==id; });
  else if(formKind==='bill') state.bills = state.bills.filter(function(x){ return x.id!==id; });
  else if(formKind==='cat'){
    state.categories = state.categories.filter(function(x){ return x.id!==id; });
    state.transactions = state.transactions.filter(function(x){ return x.categoryId!==id; });
  }
  else if(formKind==='tx') state.transactions = state.transactions.filter(function(x){ return x.id!==id; });
  else if(formKind==='debt') state.debts = state.debts.filter(function(x){ return x.id!==id; });
  else if(formKind==='goal') state.goals = state.goals.filter(function(x){ return x.id!==id; });
  saveState();
  closeSheet();
  render();
  toast('Deleted');
}

/* ---------- actions ---------- */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2200);
}

function setView(v){
  view = v;
  closeSheet();
  window.scrollTo(0,0);
  render();
}

function togglePaid(id){
  const b = state.bills.find(function(x){ return x.id===id; });
  if(!b) return;
  const k = thisMonthKey();
  b.paid = b.paid || [];
  const i = b.paid.indexOf(k);
  if(i===-1) b.paid.push(k);
  else b.paid.splice(i,1);
  b.paid = b.paid.slice(-36);
  saveState();
  render();
}

function loadExample(){
  state = sanitizeState(exampleData());
  saveState();
  closeSheet();
  view = 'overview';
  render();
  toast('Example data loaded');
}

function clearAll(){
  state = emptyState();
  saveState();
  closeSheet();
  view = 'overview';
  planExpanded = false;
  render();
  toast('All data cleared');
}

function exportJson(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pack-plan-backup-'+isoDate(today())+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Backup downloaded');
  }catch(e){
    toast('Could not export');
  }
}

function importJsonFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = function(){ toast('Could not read that file'); };
  reader.onload = function(){
    try{
      const d = JSON.parse(String(reader.result||''));
      const next = sanitizeState(d);
      const count = next.income.length+next.bills.length+next.categories.length+next.transactions.length+next.debts.length+next.goals.length;
      if(!count && !(d && typeof d==='object')){
        toast('That file doesn’t look like a '+APP_NAME+' backup');
        return;
      }
      state = next;
      if(d && d.theme === 'light' || d && d.theme === 'dark'){
        window.__theme.set(d.theme);
      }
      saveState();
      view = 'overview';
      closeSheet();
      render();
      toast('Imported '+count+' item'+(count===1?'':'s'));
    }catch(e){
      toast('Could not import — check that the file is JSON');
    }
  };
  reader.readAsText(file);
}

function applyExtra(){
  const el = document.getElementById('extra-pay');
  if(!el) return;
  const raw = el.value.trim();
  let next = 0;
  if(raw!==''){
    const r = parseMoneyInput(el.value);
    if(!r.ok){ toast(r.err||'Enter a valid extra payment'); return; }
    next = r.value;
  }
  if(round2(state.payoff.extra||0) === next) return;
  state.payoff.extra = next;
  saveState();
  const keep = true;
  render();
  const again = document.getElementById('extra-pay');
  if(again && document.activeElement && document.activeElement.id==='extra-pay'){
    again.focus();
    const v=again.value;
    try{ again.setSelectionRange(v.length,v.length); }catch(e){}
  }
}

function onClick(e){
  const a = e.target.closest('[data-act]');
  if(!a) return;
  const act = a.getAttribute('data-act');
  const id = a.getAttribute('data-id');
  if(act==='view'){ setView(a.getAttribute('data-view')); }
  else if(act==='close-sheet'){ closeSheet(); }
  else if(act==='edit-income'){ sheetIncome(id); }
  else if(act==='edit-bill'){ sheetBill(id); }
  else if(act==='edit-cat'){ sheetCat(id); }
  else if(act==='edit-tx'){ sheetTx(id); }
  else if(act==='edit-debt'){ sheetDebt(id); }
  else if(act==='edit-goal'){ sheetGoal(id); }
  else if(act==='save-form'){ saveForm(); }
  else if(act==='delete-form'){ deleteForm(); }
  else if(act==='toggle-paid'){ togglePaid(id); }
  else if(act==='payoff-method'){
    state.payoff.method = a.getAttribute('data-method')==='avalanche'?'avalanche':'snowball';
    saveState(); render();
  }
  else if(act==='toggle-plan'){ planExpanded = !planExpanded; render(); }
  else if(act==='theme'){
    window.__theme.set(a.getAttribute('data-theme')==='light'?'light':'dark');
    render();
  }
  else if(act==='currency'){
    state.currency = a.getAttribute('data-cur')||'$';
    const inp = document.getElementById('currency-input');
    if(inp) inp.value = state.currency;
    saveState(); render();
  }
  else if(act==='export'){ exportJson(); }
  else if(act==='import'){ const f=document.getElementById('import-file'); if(f) f.click(); }
  else if(act==='load-example'){
    const has = state.income.length+state.bills.length+state.categories.length+state.debts.length+state.goals.length;
    if(has){
      confirmSheet('Replace what’s here?','Loading example data will replace the numbers currently on this device. They’re clearly labeled examples, not anyone’s real finances.','Load example','confirm-example', false);
    }else{
      loadExample();
    }
  }
  else if(act==='confirm-example'){ loadExample(); }
  else if(act==='clear-all'){
    confirmSheet('Clear all data?','This removes income, bills, spending, debts, and goals from this device. Export a backup first if you want to keep a copy.','Clear everything','confirm-clear', true);
  }
  else if(act==='confirm-clear'){ clearAll(); }
}

function onChange(e){
  if(e.target && e.target.id==='f-freq' && formKind==='bill'){
    const wrap = document.getElementById('f-due-wrap');
    if(wrap) wrap.innerHTML = dueFields(null, e.target.value);
  }
  if(e.target && e.target.id==='import-file'){
    const f = e.target.files && e.target.files[0];
    importJsonFile(f);
    e.target.value = '';
  }
}

function onInput(e){
  if(!e.target) return;
  if(e.target.id==='f-amount' || e.target.id==='f-freq'){
    if(formKind==='income') updateIncomePreview();
  }
  if(e.target.id==='currency-input'){
    const v = e.target.value.slice(0,4);
    state.currency = v || '$';
    saveState();
  }
}

let extraTimer = 0;
function onExtraBlur(){
  if(document.getElementById('extra-pay')) applyExtra();
}

function onKey(e){
  if(e.key==='Escape'){ if(document.body.classList.contains('sheet-open')){ closeSheet(); e.preventDefault(); } }
  if(e.key==='Enter' && document.body.classList.contains('sheet-open')){
    const t = e.target;
    if(t && (t.tagName==='INPUT' || t.tagName==='SELECT') && t.type!=='textarea'){
      e.preventDefault();
      saveForm();
    }
  }
}

document.getElementById('scrim').addEventListener('click', closeSheet);
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('input', onInput);
document.addEventListener('keydown', onKey);
document.addEventListener('focusout', function(e){
  if(e.target && e.target.id==='extra-pay') onExtraBlur();
  if(e.target && e.target.id==='currency-input'){ render(); }
});
document.addEventListener('keydown', function(e){
  if(e.target && e.target.id==='extra-pay' && e.key==='Enter'){ e.preventDefault(); applyExtra(); }
});

/* ---------- boot ---------- */
function registerShellSW(){
  if(!('serviceWorker' in navigator)) return;
  try{ navigator.serviceWorker.register('./sw.js').then(null, function(){}); }
  catch(e){}
}
state = loadState();
document.getElementById('brand').innerHTML = logoMark(44);
render();
registerShellSW();

window.__wb = {
  monthlyEquivalent: monthlyEquivalent,
  payoffPlan: payoffPlan,
  round2: round2,
  getState: function(){ return state; },
  setState: function(s){ state = sanitizeState(s); saveState(); render(); },
  monthlyIncome: monthlyIncome,
  plannedSpending: plannedSpending,
  leftToAssign: leftToAssign,
  nextDue: nextDue,
  goalProjection: goalProjection,
  billMonthly: billMonthly,
  spentInMonth: spentInMonth,
  exampleData: exampleData,
  loadExample: loadExample,
  clearAll: clearAll,
  fmt: fmt,
  STORE_KEY: STORE_KEY
};
</script>
</body>
</html>
